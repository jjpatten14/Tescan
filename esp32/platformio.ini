[env:xiao_esp32c6]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c6
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
