[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.2.0

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_SSID=\"TeslanCANBridge\"
    -DWIFI_PASS=\"tescan123\"
    -DWEBSOCKET_PORT=81
    ; Vehicle bus pins (bidirectional)
    -DCAN_VEHICLE_TX_PIN=21
    -DCAN_VEHICLE_RX_PIN=22
    ; Chassis bus pins — RX only. TX pin must be physically disconnected on the PCB.
    -DCAN_CHASSIS_RX_PIN=34
    ; 500kbps is standard for both Tesla buses
    -DCAN_BAUDRATE=500
